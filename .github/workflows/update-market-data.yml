name: Update market data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_market_data.py'
      - '.github/workflows/update-market-data.yml'
  schedule:
    - cron: '30 1 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/update_market_data.py
      - name: Commit validated snapshot
        run: |
          if ! git diff --quiet -- data/market-data.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/market-data.json
            git commit -m 'data: refresh complete month-end index prices'
            git push
          fi
  deploy:
    needs: update
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
